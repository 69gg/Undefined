name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  # 推送容器镜像到 GHCR 的 packages: write 收窄到 build-docker / merge-docker
  # 两个 job（job 级 permissions 是覆盖而非合并，所以那边要一并声明 contents）。

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  ANDROID_NDK_VERSION: "27.2.12479018"
  # 部署镜像：本体与 lxmusic2api（后者上游无预构建镜像，需我们 clone 后构建）
  BOT_IMAGE: ghcr.io/${{ github.repository_owner }}/undefined-bot
  LXMUSIC2API_IMAGE: ghcr.io/${{ github.repository_owner }}/undefined-lxmusic2api
  # build-push-action 默认会把构建记录作为 **非 zip** artifact 上传，而
  # actions/download-artifact 不带 name/pattern 时会下载全部 artifact 并在
  # 非 zip 上失败（官方 README 明确警告要加 pattern: "!*.dockerbuild"）。
  # 这里从源头关掉：构建记录对本流程没有用处。
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify-python:
    name: Verify Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      # 打开「真实构建 wheel 并校验模板随包分发」的打包测试
      # （tests/test_deploy_packaging.py），与 ci.yml 的 quality-check 一致。
      UNDEFINED_DEPLOY_WHEEL_CHECK: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: uv sync --group dev -p ${{ env.PYTHON_VERSION }}

      # WebUI 前端行为测试用 jsdom 驱动真实 DOM；缺这段安装时相关用例会
      # 在 CI 上直接失败（tests/test_webui_runtime_chat_behavior.py 的 _require_env）。
      - name: Install frontend test dependencies
        run: npm ci --prefix tests/frontend

      - name: Validate release tag, build versions, and changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: uv run python scripts/release_notes.py validate --tag "$TAG_NAME"

      - name: Cache Ruff
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruff-

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Cache Mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/uv.lock') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ hashFiles('**/uv.lock') }}-
            ${{ runner.os }}-mypy-

      - name: Run Mypy
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest tests/

      - name: Build Python distributions
        run: uv build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  verify-native-app:
    name: Verify ${{ matrix.product }} app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: console
            app_dir: apps/undefined-console
          - product: chat
            app_dir: apps/undefined-chat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.app_dir }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app_dir }}/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app_dir)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: verify-${{ matrix.product }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', matrix.app_dir), format('{0}/package-lock.json', matrix.app_dir)) }}
          workspaces: |
            ${{ matrix.app_dir }}/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install app dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.app_dir }}
        run: npm ci

      - name: Run native app checks
        working-directory: ${{ matrix.app_dir }}
        run: npm run check

  build-tauri-desktop:
    name: Build Tauri desktop (${{ matrix.product }} ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: release
    needs:
      - verify-python
      - verify-native-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: ubuntu-latest
            label: linux-x64
            bundles: appimage,deb
            rust_target: ""
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: windows-latest
            label: windows-x64
            bundles: nsis,msi
            rust_target: ""
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: macos-15
            label: macos-x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: macos-15
            label: macos-arm64
            bundles: dmg
            rust_target: ""
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: ubuntu-latest
            label: linux-x64
            bundles: appimage,deb
            rust_target: ""
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: windows-latest
            label: windows-x64
            bundles: nsis,msi
            rust_target: ""
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: macos-15
            label: macos-x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: macos-15
            label: macos-arm64
            bundles: dmg
            rust_target: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.app_dir }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app_dir }}/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app_dir)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-

      - name: Install Rust toolchain
        if: matrix.rust_target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain with target
        if: matrix.rust_target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.product }}-${{ matrix.label }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', matrix.app_dir), format('{0}/package-lock.json', matrix.app_dir)) }}
          workspaces: |
            ${{ matrix.app_dir }}/src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install app dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.app_dir }}
        run: npm ci

      - name: Build Tauri bundles
        working-directory: ${{ matrix.app_dir }}
        shell: bash
        run: |
          TAURI_ARGS="--ci --bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.rust_target }}" ]; then
            TAURI_ARGS="$TAURI_ARGS --target ${{ matrix.rust_target }}"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            NO_STRIP=true npm run tauri:build -- $TAURI_ARGS
          else
            npm run tauri:build -- $TAURI_ARGS
          fi

      - name: Collect release artifacts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          LABEL: ${{ matrix.label }}
          APP_DIR: ${{ matrix.app_dir }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          copy_single_match() {
            local search_root="$1"
            local pattern="$2"
            local destination="$3"
            local matches=()
            while IFS= read -r line; do
              matches+=("$line")
            done < <(find "$search_root" -type f -name "$pattern" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one match for $pattern under $search_root, found ${#matches[@]}" >&2
              printf 'Matches:\n%s\n' "${matches[*]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "$destination"
          }

          if [ -n "$RUST_TARGET" ]; then
            BUNDLE_ROOT="$APP_DIR/src-tauri/target/$RUST_TARGET/release/bundle"
          else
            BUNDLE_ROOT="$APP_DIR/src-tauri/target/release/bundle"
          fi

          mkdir -p release-artifacts
          case "$LABEL" in
            linux-x64)
              copy_single_match "$BUNDLE_ROOT" '*.AppImage' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.AppImage"
              copy_single_match "$BUNDLE_ROOT" '*.deb' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.deb"
              ;;
            windows-x64)
              copy_single_match "$BUNDLE_ROOT" '*.exe' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}-setup.exe"
              copy_single_match "$BUNDLE_ROOT" '*.msi' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.msi"
              ;;
            macos-x64|macos-arm64)
              copy_single_match "$BUNDLE_ROOT" '*.dmg' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.dmg"
              ;;
          esac

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.product }}-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error

  build-tauri-android:
    name: Build Tauri Android (${{ matrix.product }} ${{ matrix.abi_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    needs:
      - verify-python
      - verify-native-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: arm64-v8a
            tauri_target: aarch64
            rust_target: aarch64-linux-android
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: armeabi-v7a
            tauri_target: armv7
            rust_target: armv7-linux-androideabi
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: x86
            tauri_target: i686
            rust_target: i686-linux-android
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: x86_64
            tauri_target: x86_64
            rust_target: x86_64-linux-android
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: arm64-v8a
            tauri_target: aarch64
            rust_target: aarch64-linux-android
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: armeabi-v7a
            tauri_target: armv7
            rust_target: armv7-linux-androideabi
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: x86
            tauri_target: i686
            rust_target: i686-linux-android
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: x86_64
            tauri_target: x86_64
            rust_target: x86_64-linux-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.app_dir }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app_dir }}/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app_dir)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.product }}-${{ matrix.abi_label }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', matrix.app_dir), format('{0}/package-lock.json', matrix.app_dir)) }}
          workspaces: |
            ${{ matrix.app_dir }}/src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android platform packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Configure Android NDK
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [ ! -d "$NDK_HOME" ]; then
            echo "Expected Android NDK at $NDK_HOME" >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install app dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.app_dir }}
        run: npm ci

      - name: Initialize Android project for CI
        working-directory: ${{ matrix.app_dir }}
        run: npm run tauri:android:init

      - name: Verify Chat Android native patches
        if: matrix.product == 'chat'
        working-directory: ${{ matrix.app_dir }}
        run: npm run tauri:android:prepare:check

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Android signing secret::${name} is required for release APK signing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure Android release signing
        working-directory: ${{ matrix.app_dir }}
        env:
          APP_PRODUCT: ${{ matrix.product }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/undefined-${APP_PRODUCT}-release.jks"
          KEYSTORE_PROPERTIES_PATH="src-tauri/gen/android/keystore.properties"
          APP_GRADLE_PATH=$(find "src-tauri/gen/android" -type f \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) | sort | head -n 1)

          if [ -z "$APP_GRADLE_PATH" ]; then
            echo "Could not find generated Android app Gradle file" >&2
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > "$KEYSTORE_PROPERTIES_PATH" <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          APP_GRADLE_PATH="$APP_GRADLE_PATH" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["APP_GRADLE_PATH"])
          text = path.read_text(encoding="utf-8")

          if path.suffix == ".kts":
              imports = []
              if "import java.io.FileInputStream" not in text:
                  imports.append("import java.io.FileInputStream")
              if "import java.util.Properties" not in text:
                  imports.append("import java.util.Properties")
              if imports:
                  text = "\n".join(imports) + "\n" + text

              keystore_setup = """android {
              val keystorePropertiesFile = rootProject.file("keystore.properties")
              val keystoreProperties = Properties()
              if (keystorePropertiesFile.exists()) {
                  FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
              }
          """
              if "keystorePropertiesFile" not in text:
                  if "android {" not in text:
                      raise SystemExit("Expected android block in generated build.gradle.kts")
                  text = text.replace("android {", keystore_setup, 1)

              signing_block = """    signingConfigs {
                      create("release") {
                          storeFile = keystoreProperties.getProperty("storeFile")?.let(::file)
                          storePassword = keystoreProperties.getProperty("storePassword")
                          keyAlias = keystoreProperties.getProperty("keyAlias")
                          keyPassword = keystoreProperties.getProperty("keyPassword")
                      }
                  }

                  buildTypes {"""
              if 'create("release")' not in text:
                  if "    buildTypes {" not in text:
                      raise SystemExit("Expected buildTypes block in generated build.gradle.kts")
                  text = text.replace("    buildTypes {", signing_block, 1)

              release_marker = '        getByName("release") {'
              release_signing = '        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")'
              if 'signingConfig = signingConfigs.getByName("release")' not in text:
                  if release_marker not in text:
                      raise SystemExit("Expected release buildType in generated build.gradle.kts")
                  text = text.replace(release_marker, release_signing, 1)
          else:
              keystore_setup = """def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {"""
              if "keystorePropertiesFile" not in text:
                  if "android {" not in text:
                      raise SystemExit("Expected android block in generated build.gradle")
                  text = text.replace("android {", keystore_setup, 1)

              signing_block = """    signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

              buildTypes {"""
              if "signingConfigs {" not in text:
                  if "    buildTypes {" not in text:
                      raise SystemExit("Expected buildTypes block in generated build.gradle")
                  text = text.replace("    buildTypes {", signing_block, 1)

              release_marker = "        release {"
              release_signing = "        release {\n            signingConfig signingConfigs.release"
              if "signingConfig signingConfigs.release" not in text:
                  if release_marker not in text:
                      raise SystemExit("Expected release buildType in generated build.gradle")
                  text = text.replace(release_marker, release_signing, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build Android release APK
        working-directory: ${{ matrix.app_dir }}
        run: npm run tauri:android -- --ci --apk --target ${{ matrix.tauri_target }}

      - name: Collect Android release artifact
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ABI_LABEL: ${{ matrix.abi_label }}
          APP_DIR: ${{ matrix.app_dir }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
        run: |
          copy_single_match() {
            local search_root="$1"
            local pattern="$2"
            local destination="$3"
            local matches=()
            while IFS= read -r line; do
              matches+=("$line")
            done < <(find "$search_root" -type f -name "$pattern" ! -name '*-unsigned.apk' | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one match for $pattern under $search_root, found ${#matches[@]}" >&2
              printf 'Matches:\n%s\n' "${matches[*]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "$destination"
          }

          mkdir -p release-artifacts
          copy_single_match "$APP_DIR/src-tauri" '*.apk' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-android-${ABI_LABEL}-release.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-${{ matrix.product }}-${{ matrix.abi_label }}
          path: release-artifacts/*
          if-no-files-found: error

  docker-pins:
    name: Resolve deployment image tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - verify-python
    outputs:
      tag: ${{ steps.pins.outputs.tag }}
      lxmusic2api_slug: ${{ steps.pins.outputs.lxmusic2api_slug }}
      lxmusic2api_sha: ${{ steps.pins.outputs.lxmusic2api_sha }}
      lxmusic2api_short: ${{ steps.pins.outputs.lxmusic2api_short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Read pinned lxmusic2api commit
        id: pins
        run: |
          # pin 是**硬要求**：短 sha 用作镜像 tag，且 tests/test_deploy_catalog.py
          # 会先断言它是完整 sha。所以这里没有「占位就跳过」的分支——那种分支在
          # 测试先失败的前提下永远不可达，只会让流程看起来宽容。
          echo "lxmusic2api_sha=$(uv run python -c "from Undefined.deploy.images import LXMUSIC2API_UPSTREAM_SHA; print(LXMUSIC2API_UPSTREAM_SHA)")" >> "$GITHUB_OUTPUT"
          echo "lxmusic2api_short=$(uv run python -c "from Undefined.deploy.images import short_sha, LXMUSIC2API_UPSTREAM_SHA; print(short_sha(LXMUSIC2API_UPSTREAM_SHA))")" >> "$GITHUB_OUTPUT"
          echo "lxmusic2api_slug=$(uv run python -c "from Undefined.deploy.images import LXMUSIC2API_UPSTREAM_SLUG; print(LXMUSIC2API_UPSTREAM_SLUG)")" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build-docker:
    name: Build ${{ matrix.platform }} images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs:
      - docker-pins
    environment: release
    # job 级 permissions 覆盖 workflow 级，所以 contents 必须一并声明，否则 checkout 失败
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个架构都在自己的原生 runner 上构建：早先的做法是在 amd64 上用 QEMU
          # 模拟 arm64，而镜像里要跑 `playwright install --with-deps chromium`，
          # 模拟环境下极易超时，一超时就阻断整个发版。
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 各架构只推 digest，最终 tag 由 merge-docker 用 imagetools 合并成 manifest list
      - name: Build and push Undefined image by digest
        id: build_bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Undefined/deploy/templates/Dockerfile.bot
          platforms: ${{ matrix.platform }}
          build-args: |
            UV_VERSION=0.9.7
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.docker-pins.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.BOT_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=undefined-bot-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=undefined-bot-${{ matrix.platform }}

      - name: Checkout lxmusic2api upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.docker-pins.outputs.lxmusic2api_slug }}
          ref: ${{ needs.docker-pins.outputs.lxmusic2api_sha }}
          path: .lxmusic2api-upstream

      - name: Build and push lxmusic2api image by digest
        id: build_lxmusic
        uses: docker/build-push-action@v6
        with:
          context: .lxmusic2api-upstream
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.docker-pins.outputs.lxmusic2api_sha }}
          outputs: type=image,name=${{ env.LXMUSIC2API_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=lxmusic2api-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=lxmusic2api-${{ matrix.platform }}

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/bot /tmp/digests/lxmusic2api
          bot_digest="${{ steps.build_bot.outputs.digest }}"
          touch "/tmp/digests/bot/${bot_digest#sha256:}"
          lx_digest="${{ steps.build_lxmusic.outputs.digest }}"
          touch "/tmp/digests/lxmusic2api/${lx_digest#sha256:}"

      - name: Upload bot digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-bot-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/bot/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload lxmusic2api digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-lxmusic2api-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/lxmusic2api/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    name: Publish multi-arch manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - docker-pins
      - build-docker
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download bot digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/bot
          pattern: digests-bot-*
          merge-multiple: true

      - name: Download lxmusic2api digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/lxmusic2api
          pattern: digests-lxmusic2api-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Undefined manifest list
        working-directory: /tmp/digests/bot
        run: |
          docker buildx imagetools create \
            -t "${BOT_IMAGE}:${{ needs.docker-pins.outputs.tag }}" \
            -t "${BOT_IMAGE}:latest" \
            $(printf "${BOT_IMAGE}@sha256:%s " *)

      - name: Create lxmusic2api manifest list
        working-directory: /tmp/digests/lxmusic2api
        run: |
          docker buildx imagetools create \
            -t "${LXMUSIC2API_IMAGE}:${{ needs.docker-pins.outputs.lxmusic2api_short }}" \
            -t "${LXMUSIC2API_IMAGE}:latest" \
            $(printf "${LXMUSIC2API_IMAGE}@sha256:%s " *)

      - name: Summarize
        run: |
          {
            echo "### 部署镜像已推送"
            echo
            echo "- \`${BOT_IMAGE}:${{ needs.docker-pins.outputs.tag }}\`（linux/amd64 + linux/arm64）"
            echo "- \`${BOT_IMAGE}:latest\`"
            echo "- \`${LXMUSIC2API_IMAGE}:${{ needs.docker-pins.outputs.lxmusic2api_short }}\`（linux/amd64 + linux/arm64）"
            echo
            echo "> GHCR 包首次推送后默认为 **private**。用户需先"
            echo "> \`docker login ghcr.io\`，或在包设置里改为 public，"
            echo "> 否则 \`uv run deploy up\` 拉取镜像会 401。"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify-python
      - merge-docker
      - build-tauri-desktop
      - build-tauri-android
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true
          # 不带 name 时会下载**全部** artifact；digests-* 是 merge-docker 用的
          # 内部文件，混进来会被 `gh release create release-downloads/*` 当成
          # 发行资产一起发出去。
          pattern: "!digests-*"

      - name: Build release notes with detailed changes
        shell: bash
        run: python3 scripts/release_notes.py notes --tag "${{ github.ref_name }}" --output release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} release-downloads/* \
            --title "Undefined ${{ github.ref_name }}" \
            --notes-file release_notes.md

  publish-pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify-python
      - publish-release
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download Python dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Verify downloaded distributions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import pathlib

          expected_version = os.environ["TAG_NAME"].removeprefix("v")
          dist_dir = pathlib.Path("dist")
          files = sorted(path.name for path in dist_dir.glob("*"))
          if not files:
              raise SystemExit("No Python distributions were downloaded")

          bad = [name for name in files if f"-{expected_version}" not in name]
          if bad:
              raise SystemExit(
                  "Downloaded distributions do not match release tag version "
                  f"{expected_version}: {bad}"
              )

          print("Distributions ready for publish:")
          for name in files:
              print(f" - {name}")
          PY

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*
