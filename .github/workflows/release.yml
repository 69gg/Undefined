name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  # 推送容器镜像到 GHCR 需要；使用内置 GITHUB_TOKEN，无需额外 secret
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  ANDROID_NDK_VERSION: "27.2.12479018"
  # 部署镜像：本体与 lxmusic2api（后者上游无预构建镜像，需我们 clone 后构建）
  BOT_IMAGE: ghcr.io/${{ github.repository_owner }}/undefined-bot
  LXMUSIC2API_IMAGE: ghcr.io/${{ github.repository_owner }}/undefined-lxmusic2api

jobs:
  verify-python:
    name: Verify Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --group dev -p ${{ env.PYTHON_VERSION }}

      - name: Validate release tag, build versions, and changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: uv run python scripts/release_notes.py validate --tag "$TAG_NAME"

      - name: Cache Ruff
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruff-

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Cache Mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/uv.lock') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ hashFiles('**/uv.lock') }}-
            ${{ runner.os }}-mypy-

      - name: Run Mypy
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest tests/

      - name: Build Python distributions
        run: uv build

      - name: Verify wheel contains packaged resources
        run: |
          uv run python -c "import glob, zipfile; wheels=glob.glob('dist/*.whl'); assert wheels, 'no wheel built'; z=zipfile.ZipFile(wheels[0]); names=set(z.namelist()); required={'config.toml.example','res/prompts/undefined.xml','img/xlwy.jpg'}; missing=sorted([p for p in required if p not in names]); assert not missing, f'missing in wheel: {missing}'"

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  verify-native-app:
    name: Verify ${{ matrix.product }} app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: console
            app_dir: apps/undefined-console
          - product: chat
            app_dir: apps/undefined-chat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.app_dir }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app_dir }}/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app_dir)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: verify-${{ matrix.product }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', matrix.app_dir), format('{0}/package-lock.json', matrix.app_dir)) }}
          workspaces: |
            ${{ matrix.app_dir }}/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install app dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.app_dir }}
        run: npm ci

      - name: Run native app checks
        working-directory: ${{ matrix.app_dir }}
        run: npm run check

  build-tauri-desktop:
    name: Build Tauri desktop (${{ matrix.product }} ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: release
    needs:
      - verify-python
      - verify-native-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: ubuntu-latest
            label: linux-x64
            bundles: appimage,deb
            rust_target: ""
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: windows-latest
            label: windows-x64
            bundles: nsis,msi
            rust_target: ""
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: macos-15
            label: macos-x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            os: macos-15
            label: macos-arm64
            bundles: dmg
            rust_target: ""
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: ubuntu-latest
            label: linux-x64
            bundles: appimage,deb
            rust_target: ""
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: windows-latest
            label: windows-x64
            bundles: nsis,msi
            rust_target: ""
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: macos-15
            label: macos-x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            os: macos-15
            label: macos-arm64
            bundles: dmg
            rust_target: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.app_dir }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app_dir }}/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app_dir)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-

      - name: Install Rust toolchain
        if: matrix.rust_target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain with target
        if: matrix.rust_target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.product }}-${{ matrix.label }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', matrix.app_dir), format('{0}/package-lock.json', matrix.app_dir)) }}
          workspaces: |
            ${{ matrix.app_dir }}/src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install app dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.app_dir }}
        run: npm ci

      - name: Build Tauri bundles
        working-directory: ${{ matrix.app_dir }}
        shell: bash
        run: |
          TAURI_ARGS="--ci --bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.rust_target }}" ]; then
            TAURI_ARGS="$TAURI_ARGS --target ${{ matrix.rust_target }}"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            NO_STRIP=true npm run tauri:build -- $TAURI_ARGS
          else
            npm run tauri:build -- $TAURI_ARGS
          fi

      - name: Collect release artifacts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          LABEL: ${{ matrix.label }}
          APP_DIR: ${{ matrix.app_dir }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          copy_single_match() {
            local search_root="$1"
            local pattern="$2"
            local destination="$3"
            local matches=()
            while IFS= read -r line; do
              matches+=("$line")
            done < <(find "$search_root" -type f -name "$pattern" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one match for $pattern under $search_root, found ${#matches[@]}" >&2
              printf 'Matches:\n%s\n' "${matches[*]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "$destination"
          }

          if [ -n "$RUST_TARGET" ]; then
            BUNDLE_ROOT="$APP_DIR/src-tauri/target/$RUST_TARGET/release/bundle"
          else
            BUNDLE_ROOT="$APP_DIR/src-tauri/target/release/bundle"
          fi

          mkdir -p release-artifacts
          case "$LABEL" in
            linux-x64)
              copy_single_match "$BUNDLE_ROOT" '*.AppImage' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.AppImage"
              copy_single_match "$BUNDLE_ROOT" '*.deb' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.deb"
              ;;
            windows-x64)
              copy_single_match "$BUNDLE_ROOT" '*.exe' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}-setup.exe"
              copy_single_match "$BUNDLE_ROOT" '*.msi' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.msi"
              ;;
            macos-x64|macos-arm64)
              copy_single_match "$BUNDLE_ROOT" '*.dmg' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-${LABEL}.dmg"
              ;;
          esac

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.product }}-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error

  build-tauri-android:
    name: Build Tauri Android (${{ matrix.product }} ${{ matrix.abi_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    needs:
      - verify-python
      - verify-native-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: arm64-v8a
            tauri_target: aarch64
            rust_target: aarch64-linux-android
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: armeabi-v7a
            tauri_target: armv7
            rust_target: armv7-linux-androideabi
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: x86
            tauri_target: i686
            rust_target: i686-linux-android
          - product: console
            app_dir: apps/undefined-console
            artifact_prefix: Undefined-Console
            abi_label: x86_64
            tauri_target: x86_64
            rust_target: x86_64-linux-android
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: arm64-v8a
            tauri_target: aarch64
            rust_target: aarch64-linux-android
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: armeabi-v7a
            tauri_target: armv7
            rust_target: armv7-linux-androideabi
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: x86
            tauri_target: i686
            rust_target: i686-linux-android
          - product: chat
            app_dir: apps/undefined-chat
            artifact_prefix: Undefined-Chat
            abi_label: x86_64
            tauri_target: x86_64
            rust_target: x86_64-linux-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.app_dir }}/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app_dir }}/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app_dir)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-${{ matrix.product }}-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-node-modules-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.product }}-${{ matrix.abi_label }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', matrix.app_dir), format('{0}/package-lock.json', matrix.app_dir)) }}
          workspaces: |
            ${{ matrix.app_dir }}/src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android platform packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Configure Android NDK
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [ ! -d "$NDK_HOME" ]; then
            echo "Expected Android NDK at $NDK_HOME" >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install app dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.app_dir }}
        run: npm ci

      - name: Initialize Android project for CI
        working-directory: ${{ matrix.app_dir }}
        run: npm run tauri:android:init

      - name: Verify Chat Android native patches
        if: matrix.product == 'chat'
        working-directory: ${{ matrix.app_dir }}
        run: npm run tauri:android:prepare:check

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Android signing secret::${name} is required for release APK signing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure Android release signing
        working-directory: ${{ matrix.app_dir }}
        env:
          APP_PRODUCT: ${{ matrix.product }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/undefined-${APP_PRODUCT}-release.jks"
          KEYSTORE_PROPERTIES_PATH="src-tauri/gen/android/keystore.properties"
          APP_GRADLE_PATH=$(find "src-tauri/gen/android" -type f \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) | sort | head -n 1)

          if [ -z "$APP_GRADLE_PATH" ]; then
            echo "Could not find generated Android app Gradle file" >&2
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > "$KEYSTORE_PROPERTIES_PATH" <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          APP_GRADLE_PATH="$APP_GRADLE_PATH" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["APP_GRADLE_PATH"])
          text = path.read_text(encoding="utf-8")

          if path.suffix == ".kts":
              imports = []
              if "import java.io.FileInputStream" not in text:
                  imports.append("import java.io.FileInputStream")
              if "import java.util.Properties" not in text:
                  imports.append("import java.util.Properties")
              if imports:
                  text = "\n".join(imports) + "\n" + text

              keystore_setup = """android {
              val keystorePropertiesFile = rootProject.file("keystore.properties")
              val keystoreProperties = Properties()
              if (keystorePropertiesFile.exists()) {
                  FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
              }
          """
              if "keystorePropertiesFile" not in text:
                  if "android {" not in text:
                      raise SystemExit("Expected android block in generated build.gradle.kts")
                  text = text.replace("android {", keystore_setup, 1)

              signing_block = """    signingConfigs {
                      create("release") {
                          storeFile = keystoreProperties.getProperty("storeFile")?.let(::file)
                          storePassword = keystoreProperties.getProperty("storePassword")
                          keyAlias = keystoreProperties.getProperty("keyAlias")
                          keyPassword = keystoreProperties.getProperty("keyPassword")
                      }
                  }

                  buildTypes {"""
              if 'create("release")' not in text:
                  if "    buildTypes {" not in text:
                      raise SystemExit("Expected buildTypes block in generated build.gradle.kts")
                  text = text.replace("    buildTypes {", signing_block, 1)

              release_marker = '        getByName("release") {'
              release_signing = '        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")'
              if 'signingConfig = signingConfigs.getByName("release")' not in text:
                  if release_marker not in text:
                      raise SystemExit("Expected release buildType in generated build.gradle.kts")
                  text = text.replace(release_marker, release_signing, 1)
          else:
              keystore_setup = """def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {"""
              if "keystorePropertiesFile" not in text:
                  if "android {" not in text:
                      raise SystemExit("Expected android block in generated build.gradle")
                  text = text.replace("android {", keystore_setup, 1)

              signing_block = """    signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

              buildTypes {"""
              if "signingConfigs {" not in text:
                  if "    buildTypes {" not in text:
                      raise SystemExit("Expected buildTypes block in generated build.gradle")
                  text = text.replace("    buildTypes {", signing_block, 1)

              release_marker = "        release {"
              release_signing = "        release {\n            signingConfig signingConfigs.release"
              if "signingConfig signingConfigs.release" not in text:
                  if release_marker not in text:
                      raise SystemExit("Expected release buildType in generated build.gradle")
                  text = text.replace(release_marker, release_signing, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build Android release APK
        working-directory: ${{ matrix.app_dir }}
        run: npm run tauri:android -- --ci --apk --target ${{ matrix.tauri_target }}

      - name: Collect Android release artifact
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ABI_LABEL: ${{ matrix.abi_label }}
          APP_DIR: ${{ matrix.app_dir }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
        run: |
          copy_single_match() {
            local search_root="$1"
            local pattern="$2"
            local destination="$3"
            local matches=()
            while IFS= read -r line; do
              matches+=("$line")
            done < <(find "$search_root" -type f -name "$pattern" ! -name '*-unsigned.apk' | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one match for $pattern under $search_root, found ${#matches[@]}" >&2
              printf 'Matches:\n%s\n' "${matches[*]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "$destination"
          }

          mkdir -p release-artifacts
          copy_single_match "$APP_DIR/src-tauri" '*.apk' "release-artifacts/${ARTIFACT_PREFIX}-${TAG}-android-${ABI_LABEL}-release.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-${{ matrix.product }}-${{ matrix.abi_label }}
          path: release-artifacts/*
          if-no-files-found: error

  build-docker:
    name: Build deployment images (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - verify-python
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Read pinned lxmusic2api commit
        id: pins
        run: |
          sha=$(uv run python -c "from Undefined.deploy.images import LXMUSIC2API_UPSTREAM_SHA; print(LXMUSIC2API_UPSTREAM_SHA)")
          slug=$(uv run python -c "from Undefined.deploy.images import LXMUSIC2API_UPSTREAM_SLUG; print(LXMUSIC2API_UPSTREAM_SLUG)")
          short=$(uv run python -c "from Undefined.deploy.images import short_sha, LXMUSIC2API_UPSTREAM_SHA; print(short_sha(LXMUSIC2API_UPSTREAM_SHA))")
          echo "lxmusic2api_slug=$slug" >> "$GITHUB_OUTPUT"
          echo "lxmusic2api_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "lxmusic2api_short=$short" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Undefined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Undefined/deploy/templates/Dockerfile.bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:${{ steps.pins.outputs.tag }}
            ${{ env.BOT_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.pins.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=undefined-bot
          cache-to: type=gha,mode=max,scope=undefined-bot

      - name: Check lxmusic2api pin is set
        id: lxmusic_check
        run: |
          sha="${{ steps.pins.outputs.lxmusic2api_sha }}"
          # 占位值说明还没 pin；此时跳过而不是构建 main HEAD，避免不可复现的镜像
          if [ -z "$sha" ] || [ "$sha" = "REPLACE_WITH_PINNED_COMMIT_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::lxmusic2api 上游 commit 尚未 pin，跳过该镜像构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout lxmusic2api upstream
        if: steps.lxmusic_check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.lxmusic2api_slug }}
          ref: ${{ steps.pins.outputs.lxmusic2api_sha }}
          path: .lxmusic2api-upstream

      - name: Build and push lxmusic2api image
        if: steps.lxmusic_check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .lxmusic2api-upstream
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.LXMUSIC2API_IMAGE }}:${{ steps.pins.outputs.lxmusic2api_short }}
            ${{ env.LXMUSIC2API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.pins.outputs.lxmusic2api_sha }}
          cache-from: type=gha,scope=lxmusic2api
          cache-to: type=gha,mode=max,scope=lxmusic2api

      - name: Summarize
        run: |
          {
            echo "### 部署镜像已推送"
            echo
            echo "- \`${BOT_IMAGE}:${{ steps.pins.outputs.tag }}\`"
            echo "- \`${BOT_IMAGE}:latest\`"
            if [ "${{ steps.lxmusic_check.outputs.skip }}" = "false" ]; then
              echo "- \`${LXMUSIC2API_IMAGE}:${{ steps.pins.outputs.lxmusic2api_short }}\`"
            else
              echo "- lxmusic2api 镜像已跳过（上游 commit 未 pin）"
            fi
            echo
            echo "> GHCR 包首次推送后默认为 **private**。用户需先"
            echo "> \`docker login ghcr.io\`，或在包设置里改为 public，"
            echo "> 否则 \`uv run deploy up\` 拉取镜像会 401。"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify-python
      - build-docker
      - build-tauri-desktop
      - build-tauri-android
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true

      - name: Build release notes with detailed changes
        shell: bash
        run: python3 scripts/release_notes.py notes --tag "${{ github.ref_name }}" --output release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} release-downloads/* \
            --title "Undefined ${{ github.ref_name }}" \
            --notes-file release_notes.md

  publish-pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify-python
      - publish-release
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download Python dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Verify downloaded distributions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import pathlib

          expected_version = os.environ["TAG_NAME"].removeprefix("v")
          dist_dir = pathlib.Path("dist")
          files = sorted(path.name for path in dist_dir.glob("*"))
          if not files:
              raise SystemExit("No Python distributions were downloaded")

          bad = [name for name in files if f"-{expected_version}" not in name]
          if bad:
              raise SystemExit(
                  "Downloaded distributions do not match release tag version "
                  f"{expected_version}: {bad}"
              )

          print("Distributions ready for publish:")
          for name in files:
              print(f" - {name}")
          PY

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*
